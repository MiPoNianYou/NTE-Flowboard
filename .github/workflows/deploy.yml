name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:coverage

      - name: Install browser for UI tests
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Test browser behavior
        run: npm run test:browser -- --project=chromium

      - name: Build
        run: npm run build
        env:
          VITE_NOTIFICATION_ENABLED: ${{ vars.VITE_NOTIFICATION_ENABLED }}
          VITE_NOTIFICATION_SUPABASE_URL: ${{ vars.VITE_NOTIFICATION_SUPABASE_URL }}
          VITE_NOTIFICATION_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_NOTIFICATION_SUPABASE_PUBLISHABLE_KEY }}
          VITE_NOTIFICATION_VAPID_PUBLIC_KEY: ${{ vars.VITE_NOTIFICATION_VAPID_PUBLIC_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
