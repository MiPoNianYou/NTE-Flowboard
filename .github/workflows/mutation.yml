name: Mutation testing

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: core logic mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore Stryker incremental result
        uses: actions/cache@v4
        with:
          path: .artifacts/mutation/stryker-incremental.json
          key: mutation-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            mutation-${{ runner.os }}-${{ github.ref_name }}-

      - name: Run mutation tests
        run: npm run test:mutation

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: .artifacts/mutation/mutation.html
          retention-days: 14
          if-no-files-found: ignore
