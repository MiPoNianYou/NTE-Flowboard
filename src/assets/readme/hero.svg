<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">NTE Flowboard</title>
  <desc id="desc">NTE Flowboard 深色界面预览，显示每日、每周和每月任务及自动重置时间</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0a0c14"/>
      <stop offset=".42" stop-color="#0d0d12"/>
      <stop offset="1" stop-color="#0f1118"/>
    </linearGradient>
    <radialGradient id="ambient-primary" cx="0" cy="0" r="1" gradientTransform="translate(230 102) rotate(42) scale(380 255)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9080f0" stop-opacity=".15"/>
      <stop offset="1" stop-color="#9080f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient-blue" cx="0" cy="0" r="1" gradientTransform="translate(1058 350) rotate(18) scale(350 248)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1868e0" stop-opacity=".11"/>
      <stop offset="1" stop-color="#1868e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient-pink" cx="0" cy="0" r="1" gradientTransform="translate(680 370) rotate(20) scale(280 165)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e01868" stop-opacity=".07"/>
      <stop offset="1" stop-color="#e01868" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#page)"/>
  <rect width="1200" height="420" fill="url(#ambient-primary)"/>
  <rect width="1200" height="420" fill="url(#ambient-blue)"/>
  <rect width="1200" height="420" fill="url(#ambient-pink)"/>

  <g transform="translate(62 54)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g aria-label="NTE Flowboard 标识">
      <image href="../nanally-icon.png" width="38" height="38" preserveAspectRatio="xMidYMid meet"/>
      <text x="50.7" y="18" fill="#e0186859" font-size="18" font-weight="700" letter-spacing="-.3">NTE Flowboard</text>
      <text x="49.3" y="18" fill="#1868e059" font-size="18" font-weight="700" letter-spacing="-.3">NTE Flowboard</text>
      <text x="50" y="18" fill="#fffffff2" font-size="18" font-weight="700" letter-spacing="-.3">NTE Flowboard</text>
      <text x="50" y="37" fill="#ffffff66" font-size="12.5">每日 · 每周 · 每月任务追踪看板</text>
    </g>

    <text x="0" y="116" fill="#fffffff2" font-size="40" font-weight="700" letter-spacing="-1.55">异环周期任务，</text>
    <text x="0" y="164" fill="#fffffff2" font-size="40" font-weight="700" letter-spacing="-1.55">按清单完成</text>
    <text x="1" y="205" fill="#ffffffa6" font-size="16">按服务器时间重置每日、每周和每月进度；可选云同步</text>

    <g transform="translate(0 238)">
      <g>
        <rect width="139" height="62" rx="12" fill="#ffffff0d" stroke="#ffffff1a"/>
        <rect x="13" y="15.5" width="28" height="28" rx="8" fill="#9080f01a"/>
        <g transform="translate(19 21.5) scale(.666667)" fill="none" stroke="#9080f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 2v4M16 2v4"/>
          <rect width="18" height="18" x="3" y="4" rx="2"/>
          <path d="M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>
        </g>
        <text x="50" y="27" fill="#fffffff2" font-size="13" font-weight="600">每日</text>
        <text x="50" y="45" fill="#ffffff66" font-size="11.5">05:00 重置</text>
      </g>
      <g transform="translate(151)">
        <rect width="139" height="62" rx="12" fill="#ffffff0d" stroke="#ffffff1a"/>
        <rect x="13" y="15.5" width="28" height="28" rx="8" fill="#15a0b81a"/>
        <g transform="translate(19 21.5) scale(.666667)" fill="none" stroke="#65c8d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="4" rx="2"/>
          <path d="M16 2v4M3 10h18M8 2v4M17 14h-6M13 18H7M7 14h.01M17 18h.01"/>
        </g>
        <text x="50" y="27" fill="#fffffff2" font-size="13" font-weight="600">每周</text>
        <text x="50" y="45" fill="#ffffff66" font-size="11.5">周一 05:00</text>
      </g>
      <g transform="translate(302)">
        <rect width="139" height="62" rx="12" fill="#ffffff0d" stroke="#ffffff1a"/>
        <rect x="13" y="15.5" width="28" height="28" rx="8" fill="#e0a0301a"/>
        <g transform="translate(19 21.5) scale(.666667)" fill="none" stroke="#e9bb66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 20a2 2 0 0 0 2 2h10a2.4 2.4 0 0 0 1.706-.706l3.588-3.588A2.4 2.4 0 0 0 21 16V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2zM15 22v-5a1 1 0 0 1 1-1h5M8 2v4M16 2v4M3 10h18"/>
        </g>
        <text x="50" y="27" fill="#fffffff2" font-size="13" font-weight="600">每月</text>
        <text x="50" y="45" fill="#ffffff66" font-size="11.5">1 日 05:00</text>
      </g>
    </g>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g id="period-tabs" transform="translate(618 62)">
      <rect width="160" height="126" rx="12" fill="#ffffff0d" stroke="#ffffff1a"/>
      <path d="M12 0h136a12 12 0 0 1 12 12v30H0V12A12 12 0 0 1 12 0Z" fill="#9080f00d"/>
      <path d="M0 42h160M0 84h160" stroke="#ffffff14"/>
      <g transform="translate(36 10.5) scale(.833333)" fill="none" stroke="#9080f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 2v4M16 2v4"/>
        <rect width="18" height="18" x="3" y="4" rx="2"/>
        <path d="M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/>
      </g>
      <text x="68" y="26" fill="#9080f0" font-size="14" font-weight="500">每日清单</text>
      <g transform="translate(36 52.5) scale(.833333)" fill="none" stroke="#ffffffa6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="18" x="3" y="4" rx="2"/>
        <path d="M16 2v4M3 10h18M8 2v4M17 14h-6M13 18H7M7 14h.01M17 18h.01"/>
      </g>
      <text x="68" y="68" fill="#ffffffa6" font-size="14" font-weight="500">每周清单</text>
      <g transform="translate(36 94.5) scale(.833333)" fill="none" stroke="#ffffffa6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 20a2 2 0 0 0 2 2h10a2.4 2.4 0 0 0 1.706-.706l3.588-3.588A2.4 2.4 0 0 0 21 16V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2zM15 22v-5a1 1 0 0 1 1-1h5M8 2v4M16 2v4M3 10h18"/>
      </g>
      <text x="68" y="110" fill="#ffffffa6" font-size="14" font-weight="500">每月清单</text>
    </g>

    <g id="add-task-card" transform="translate(618 200)">
      <rect width="160" height="44" rx="12" fill="#ffffff0d" stroke="#ffffff14"/>
      <g transform="translate(31 12) scale(.833333)" fill="none" stroke="#ffffff66" stroke-width="2" stroke-linecap="round">
        <path d="M5 12h14M12 5v14"/>
      </g>
      <text x="59" y="27" fill="#ffffffa6" font-size="14" font-weight="500">添加新任务</text>
    </g>

    <g id="progress-card" transform="translate(618 256)">
      <rect width="160" height="112" rx="12" fill="#ffffff0d" stroke="#ffffff1a"/>
      <text x="16" y="42" fill="#fffffff2" font-size="14" font-weight="500">今日进度</text>
      <text x="16" y="62" fill="#ffffffa6" font-size="11.5">2 / 6 项已完成</text>
      <text x="16" y="80" fill="#ffffff66" font-size="10">6小时6分钟后重置</text>
      <circle cx="128" cy="56" r="20" fill="none" stroke="#ffffff14" stroke-width="4"/>
      <circle cx="128" cy="56" r="20" fill="none" stroke="#9080f0" stroke-width="4" stroke-linecap="round" stroke-dasharray="41.5 126" transform="rotate(-90 128 56)"/>
      <text x="128" y="60" text-anchor="middle" fill="#fffffff2" font-size="11.5" font-weight="700">33%</text>
    </g>

    <g id="daily-checklist-panel" transform="translate(794 53)">
      <rect width="370" height="324" rx="12" fill="#ffffff0d" stroke="#ffffff1a"/>

      <g id="task-row-1" transform="translate(24 29)">
        <g fill="#ffffff52"><circle cx="2" cy="8" r="1.05"/><circle cx="2" cy="13" r="1.05"/><circle cx="2" cy="18" r="1.05"/><circle cx="7" cy="8" r="1.05"/><circle cx="7" cy="13" r="1.05"/><circle cx="7" cy="18" r="1.05"/></g>
        <circle cx="29" cy="13" r="10" fill="#14ad81" stroke="#14ad81" stroke-width="1.45"/>
        <path d="m24.5 13 3.1 3.1 5.9-6.1" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="50" y="18" fill="#ffffff66" font-size="14">领一咖舍收益</text>
        <path d="M50 12.5h84" fill="none" stroke="#14ad81" stroke-width="1" stroke-dasharray="3 2"/>
        <rect x="292" y="1" width="42" height="24" rx="12" fill="#e8803024"/>
        <text x="313" y="17" text-anchor="middle" fill="#e88030" font-size="11.5" font-weight="600">大亨</text>
      </g>
      <g id="task-row-2" transform="translate(24 77)">
        <g fill="#ffffff52"><circle cx="2" cy="8" r="1.05"/><circle cx="2" cy="13" r="1.05"/><circle cx="2" cy="18" r="1.05"/><circle cx="7" cy="8" r="1.05"/><circle cx="7" cy="13" r="1.05"/><circle cx="7" cy="18" r="1.05"/></g>
        <circle cx="29" cy="13" r="10" fill="#14ad81" stroke="#14ad81" stroke-width="1.45"/>
        <path d="m24.5 13 3.1 3.1 5.9-6.1" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="50" y="18" fill="#ffffff66" font-size="14">纳库佩达之池</text>
        <path d="M50 12.5h84" fill="none" stroke="#14ad81" stroke-width="1" stroke-dasharray="3 2"/>
        <rect x="292" y="1" width="42" height="24" rx="12" fill="#e8525224"/>
        <text x="313" y="17" text-anchor="middle" fill="#e87878" font-size="11.5" font-weight="600">地图</text>
      </g>
      <g id="task-row-3" transform="translate(24 125)">
        <g fill="#ffffff52"><circle cx="2" cy="8" r="1.05"/><circle cx="2" cy="13" r="1.05"/><circle cx="2" cy="18" r="1.05"/><circle cx="7" cy="8" r="1.05"/><circle cx="7" cy="13" r="1.05"/><circle cx="7" cy="18" r="1.05"/></g>
        <circle cx="29" cy="13" r="10" fill="none" stroke="#ffffff4d" stroke-width="1.45"/>
        <text x="50" y="18" fill="#fffffff2" font-size="14">魔女之家占卜</text>
        <rect x="292" y="1" width="42" height="24" rx="12" fill="#e8525224"/>
        <text x="313" y="17" text-anchor="middle" fill="#e87878" font-size="11.5" font-weight="600">地图</text>
      </g>
      <g id="task-row-4" transform="translate(24 173)">
        <g fill="#ffffff52"><circle cx="2" cy="8" r="1.05"/><circle cx="2" cy="13" r="1.05"/><circle cx="2" cy="18" r="1.05"/><circle cx="7" cy="8" r="1.05"/><circle cx="7" cy="13" r="1.05"/><circle cx="7" cy="18" r="1.05"/></g>
        <circle cx="29" cy="13" r="10" fill="none" stroke="#ffffff4d" stroke-width="1.45"/>
        <text x="50" y="18" fill="#fffffff2" font-size="14">福荫树木祈愿</text>
        <rect x="292" y="1" width="42" height="24" rx="12" fill="#e8525224"/>
        <text x="313" y="17" text-anchor="middle" fill="#e87878" font-size="11.5" font-weight="600">地图</text>
      </g>
      <g id="task-row-5" transform="translate(24 221)">
        <g fill="#ffffff52"><circle cx="2" cy="8" r="1.05"/><circle cx="2" cy="13" r="1.05"/><circle cx="2" cy="18" r="1.05"/><circle cx="7" cy="8" r="1.05"/><circle cx="7" cy="13" r="1.05"/><circle cx="7" cy="18" r="1.05"/></g>
        <circle cx="29" cy="13" r="10" fill="none" stroke="#ffffff4d" stroke-width="1.45"/>
        <text x="50" y="18" fill="#fffffff2" font-size="14">赠送角色礼物</text>
        <rect x="292" y="1" width="42" height="24" rx="12" fill="#d4a02024"/>
        <text x="313" y="17" text-anchor="middle" fill="#d4a020" font-size="11.5" font-weight="600">羁遇</text>
      </g>
      <g id="task-row-6" transform="translate(24 269)">
        <g fill="#ffffff52"><circle cx="2" cy="8" r="1.05"/><circle cx="2" cy="13" r="1.05"/><circle cx="2" cy="18" r="1.05"/><circle cx="7" cy="8" r="1.05"/><circle cx="7" cy="13" r="1.05"/><circle cx="7" cy="18" r="1.05"/></g>
        <circle cx="29" cy="13" r="10" fill="none" stroke="#ffffff4d" stroke-width="1.45"/>
        <text x="50" y="18" fill="#fffffff2" font-size="14">角色都市偕游</text>
        <rect x="292" y="1" width="42" height="24" rx="12" fill="#d4a02024"/>
        <text x="313" y="17" text-anchor="middle" fill="#d4a020" font-size="11.5" font-weight="600">羁遇</text>
      </g>
    </g>
  </g>
</svg>
